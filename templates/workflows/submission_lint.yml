# Structural checks: required files present. (DCO enforced via the DCO app.)
name: Submission Lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files (Tier 1 floor)
        run: |
          fail=0
          for f in README.md CITATION.cff; do
            [ -f "$f" ] || { echo "MISSING: $f"; fail=1; }
          done
          # License file, common conventions: LICENSE, LICENSE.txt/.md,
          # COPYING, COPYING.txt (GPL projects ship LICENSE.txt or COPYING).
          # Looped existence test (not `ls`, which returns non-zero under
          # -eo pipefail when any listed name is absent). A non-matching
          # glob stays literal and simply fails [ -e ].
          have_license=0
          for f in LICENSE LICENSE.* COPYING COPYING.*; do
            if [ -e "$f" ]; then have_license=1; break; fi
          done
          if [ "$have_license" -eq 0 ]; then
            echo "MISSING: LICENSE (accepts LICENSE, LICENSE.*, COPYING, COPYING.*)"
            fail=1
          fi
          # Dependency manifests may live anywhere in the tree — Visual Studio
          # convention puts .csproj in a project subdirectory, not the repo root.
          # Prune vendored/virtualenv trees: a committed .venv or node_modules
          # is full of other projects' manifests and would mask a missing one.
          manifests=$(find . \( -name .git -o -name .venv -o -name venv \
              -o -name node_modules -o -name site-packages \) -prune -o -type f \( \
              -name 'requirements*.txt' \
              -o -name 'pyproject.toml' \
              -o -name 'setup.py' \
              -o -name 'setup.cfg' \
              -o -name 'environment.yml' \
              -o -name 'Pipfile' \
              -o -name 'Pipfile.lock' \
              -o -name 'package.json' \
              -o -name '*.csproj' \
              -o -name 'packages.config' \
            \) -print)
          if [ -z "$manifests" ]; then
            echo "MISSING: pinned dependency manifest (searched recursively for requirements*.txt, pyproject.toml, setup.py, setup.cfg, environment.yml, Pipfile, Pipfile.lock, package.json, *.csproj, packages.config)"
            fail=1
          fi
          exit $fail
      - name: Dependencies declare a version relation (R1.4 / R-13)
        run: |
          # Checks the mechanical half of R1.4 only: that every declared
          # dependency carries SOME version relation, and that no git+
          # reference floats. Whether the relation is RIGHT for the submission
          # type (pins for applications, lower bounds for libraries) is a
          # reviewer judgement and is deliberately not attempted here.
          python - <<'PY'
          import re, sys, pathlib, tomllib

          OPS = ("==", ">=", "<=", "~=", "!=", "===", ">", "<")
          bare, floating = [], []

          def check(spec, origin):
              s = spec.split("#")[0].strip().rstrip(",").strip().strip('"\'')
              if not s or s.startswith("-"):
                  return
              if "@" in s:                      # PEP 508 direct reference
                  url = s.split("@", 1)[1].strip()
                  if url.startswith(("git+", "hg+", "svn+", "bzr+")):
                      # Needs @<rev> AFTER the URL: git+https://host/repo@<sha|tag>
                      if "@" not in url.split("://", 1)[-1]:
                          floating.append(f"{origin}: {s}")
                  return
              # Strip the extras group before looking for an operator, so
              # "pkg[all]>=1.0" is not mistaken for a bare name.
              base = re.sub(r"\[.*?\]", "", s)
              name = re.split(r"[<>=!~;]", base, 1)[0].strip()
              if not name:
                  return
              if not any(op in base[len(name):] for op in OPS):
                  bare.append(f"{origin}: {s}")

          # Parsed with tomllib, not a regex: a non-greedy bracket match stops
          # at the first "]", which truncates the list as soon as any
          # dependency uses an extras group.
          pp = pathlib.Path("pyproject.toml")
          if pp.is_file():
              try:
                  data = tomllib.loads(pp.read_text(encoding="utf-8"))
              except tomllib.TOMLDecodeError as exc:
                  print(f"FAIL: pyproject.toml does not parse: {exc}")
                  sys.exit(1)
              # Runtime deps only. optional-dependencies are dev/extras and are
              # not what a consumer installs by default.
              for spec in data.get("project", {}).get("dependencies", []):
                  check(spec, "pyproject.toml")

          for req in sorted(pathlib.Path(".").glob("requirements*.txt")):
              for line in req.read_text(encoding="utf-8").splitlines():
                  check(line, req.name)

          fail = False
          if bare:
              fail = True
              print("FAIL: dependency declared with no version relation "
                    "(R1.4 — a bare name is never acceptable):")
              for b in bare:
                  print(f"  {b}")
              print("  Library? add a lower bound, e.g. numpy>=1.24.")
              print("  Application? pin exactly or ship a lockfile.")
          if floating:
              fail = True
              print("FAIL: VCS dependency not pinned to a commit or tag "
                    "(R1.4 — resolves to whatever the branch holds today):")
              for f in floating:
                  print(f"  {f}")
              print("  Append a revision: pkg @ git+https://host/repo@<sha>")
          if not fail:
              print("OK: every declared dependency carries a version relation.")
          sys.exit(1 if fail else 0)
          PY

      - name: OSI license check (CITATION.cff)
        run: |
          # Reads the SPDX id from CITATION.cff's 'license:' field and checks it
          # against a list of common OSI-approved ids. An unrecognized id is not
          # necessarily non-OSI — the step fails so a reviewer verifies manually.
          if [ ! -f CITATION.cff ]; then
            echo "SKIP: CITATION.cff missing (reported by the required-files step)"
            exit 0
          fi
          license=$(sed -n 's/^license:[[:space:]]*//p' CITATION.cff | head -n 1 | tr -d "'\"\r" | sed 's/[[:space:]]*$//')
          if [ -z "$license" ]; then
            echo "FAIL: no 'license:' field found in CITATION.cff"
            exit 1
          fi
          osi_ids="Apache-2.0 MIT BSD-2-Clause BSD-3-Clause GPL-2.0-only GPL-2.0-or-later GPL-3.0-only GPL-3.0-or-later LGPL-2.1-only LGPL-2.1-or-later LGPL-3.0-only LGPL-3.0-or-later MPL-2.0 EPL-2.0 AGPL-3.0-only AGPL-3.0-or-later ISC Zlib BSL-1.0 Artistic-2.0 EUPL-1.2"
          for id in $osi_ids; do
            if [ "$license" = "$id" ]; then
              echo "OK: license '$license' is on the known-OSI list"
              exit 0
            fi
          done
          echo "FAIL: license '$license' not in known-OSI list - reviewer must verify OSI approval manually"
          exit 1
