# ---------------------------------------------------------------------------
# TEMPLATE — drop this file into a submission's .github/workflows/ directory.
# The index org is `medphys-code-exchange`; the scanners live in its `index`
# repo. SCANNER_REF below is pinned to the current scanner release. Check
# github.com/medphys-code-exchange/index/releases for a newer tag before you
# submit; a reviewer may ask you to move to it.
# Submission CI must pin SCANNER_REF to a tagged scanner release, never a
# branch: an unpinned ref makes scan results irreproducible, and a compromised
# or edited default branch would silently change the code that runs inside
# every submission's CI (supply-chain integrity).
# ---------------------------------------------------------------------------
name: Vendor Binary Scan
on: [push, pull_request]
env:
  # Tagged scanner release to fetch.
  SCANNER_REF: scanners-v0.2.0
jobs:
  vendor-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # No pip install here: vendor_binary_scan.py is stdlib-only
      # (unlike phi_scan.py, which needs pydicom).
      - name: Fetch scanner (pinned)
        run: curl -sSfL -o vendor_binary_scan.py "https://raw.githubusercontent.com/medphys-code-exchange/index/${SCANNER_REF}/scripts/vendor_binary_scan.py"
      - name: Scan
        run: python vendor_binary_scan.py .
