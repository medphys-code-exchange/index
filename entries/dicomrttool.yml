# Pilot submission — the first end-to-end pipeline test (D12).
# Currently UNDER REVIEW (verified_date empty).
#
# RE-TIERED 2 -> C on 2026-07-27. Two write-back paths reach the clinic:
# prediction_array_to_RT() writes model segmentations into an RT structure set
# (the auto-contouring hand-off — a physicist imports, edits, and plans on the
# result), and rewrite_RT() renames ROIs in an existing structure set and saves
# IN PLACE. Either alone is Tier C. Full determination and the
# whole-submission (not partial-scope) reading: docs/governance.md.
#
# ACCEPTANCE IS BLOCKED ON RC.4 ONLY (as of v6.2.0, 2026-07-30). RC.4 requires
# two reviewers with at least one fully independent of the submitting
# institution; no co-lead exists yet. The 2026-07-24 pilot exception permits
# self-review to exercise the mechanics, but it explicitly does NOT extend to
# a Tier C acceptance — that badge would assert independent clinical review
# that did not happen. Recruiting an independent reviewer is the only thing
# that clears this.
#
# Everything else cleared at tag v6.2.0 (released 2026-07-30, CI green on the
# tag commit, phi/vendor scans exit 0 on the tag tree):
#   R-13/R1.4 — all deps carry lower bounds (library: no caps), the
#        rtmask-conformance VCS dep is SHA-pinned, and the reproducibility
#        record is constraints/ci-linux-py3.12.txt, CI-enforced.
#   RC.1 validation dataset  — validation/run_validation.py: site-runnable,
#        converts a pinned-suite synthetic fixture through the public API and
#        compares against analytic sub-voxel-quadrature ground truth; writes an
#        environment-stamped report and discloses locally-relaxed thresholds.
#        Reviewer note: the fixture is generated deterministically by the
#        SHA-pinned conformance dependency, not literally bundled — judgment
#        call for the independent reviewer.
#   RC.2 commissioning checklist — docs/COMMISSIONING.md.
#   RC.3 versioned-use statement — README "Versioned use".
#   RC.5 intended-use statement  — README "Intended use".
