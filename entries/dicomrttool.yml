# Pilot submission — the first end-to-end pipeline test (D12).
# Currently UNDER REVIEW (verified_date empty).
#
# RE-TIERED 2 -> C on 2026-07-27. Two write-back paths reach the clinic:
# prediction_array_to_RT() writes model segmentations into an RT structure set
# (the auto-contouring hand-off — a physicist imports, edits, and plans on the
# result), and rewrite_RT() renames ROIs in an existing structure set and saves
# IN PLACE. Either alone is Tier C. Full determination and the
# whole-submission (not partial-scope) reading: docs/governance.md.
#
# ACCEPTANCE IS BLOCKED, and not on quality. RC.4 requires two reviewers with
# at least one fully independent of the submitting institution; no co-lead
# exists yet. The 2026-07-24 pilot exception permits self-review to exercise
# the mechanics, but it explicitly does NOT extend to a Tier C acceptance —
# that badge would assert independent clinical review that did not happen.
# Recruiting an independent reviewer is the only thing that clears this.
#
# Tier C deliverables, self-assessed 2026-07-27:
#   RC.1 validation dataset  — PARTIAL. tests/conformance.yaml + the synthetic
#        primitives are known-correct outputs with tolerances, which is the
#        substance of RC.1, but they are a developer pytest gate rather than
#        something a site can run. NOT satisfied by the TCIA notebook: that
#        data is downloaded at runtime (~3.3 GB), not bundled, and clinical
#        contours are inputs without an oracle.
#   RC.2 commissioning checklist — MISSING.
#   RC.3 versioned-use statement — MISSING (README has no clinical language).
#   RC.5 intended-use statement  — MISSING (same).
#
# BLOCKER ON THE REVIEWED COMMIT, independent of tier: at a5c09e6 (tag v6.1.0)
